[reload_grab]
enabled=1

[grenade]
toggle=0

[crouch]
mode=toggle
uncrouch_on_jump=0
jump_delay_ms=250

[tactical]
block_hand_trigger_in_game=1

[sprint]
enabled=0
start_below_eyes_cm=30
stop_below_eyes_cm=20

[weapon_switch]
enabled=1
method=grab
; Next Weapon order, any of: primary, secondary, arc_tool, grenade, empty
cycle=primary,secondary,arc_tool,empty

[holsters]
learn=1
assist=1
assist_radius_cm=15

[triggers]
; PS VR2 Sense adaptive triggers through PSVR2Toolkit; does nothing on other controllers
enabled=1
; leave empty to find psvr2_toolkit_capi.dll in the PlayStation VR2 App
capi_path=
; effect of the gun hand's trigger per kind of gun: <mode> <parameters>
;   off | feedback <pos 0-9> <strength 0-8> | weapon <start 2-7> <end 3-8> <strength 0-8>
;   vibration <pos 0-9> <amplitude 0-8> <Hz> | slope <start> <end> <start strength 1-8> <end strength 1-8>
;   multi <10 strengths> | multi_vibration <Hz> <10 amplitudes>
none=off
pistol=weapon 4 6 7
auto=feedback 3 3
marksman=weapon 5 7 8
shotgun=weapon 3 6 8
launcher=slope 2 8 3 8
arc_tool=feedback 2 2
titan=slope 1 8 4 8
; played instead for firing_ms after each shot; <kind>_firing works for every kind, empty = no change
auto_firing=vibration 3 5 30
titan_firing=vibration 2 6 15
firing_ms=150
empty_magazine=off
